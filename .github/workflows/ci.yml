# CI/CD: mỗi lần push/PR → test + build image trên máy sạch.
# Chỉ khi cả hai xanh VÀ là push lên main → gọi Render deploy hook + smoke test.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bỏ test_cp5 (gọi bản deploy đang sống) và test_bonus_cicd (tự kiểm tra
      # badge của chính workflow này). Test build Docker do job `build` lo.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Check image size < 500MB
        run: |
          size=$(docker image inspect day12-agent:${{ github.sha }} --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((500 * 1024 * 1024))

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Smoke test
        run: |
          sleep 45
          for i in $(seq 1 10); do
            curl -fsS "$PUBLIC_URL/health" && exit 0
            echo "chưa sẵn sàng, thử lại sau 15s..."
            sleep 15
          done
          exit 1
